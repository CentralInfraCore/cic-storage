project:
  name: cic-storage
  description: CIC storage domain — provider-agnostic storage intent schemas (StorageBucket) composed from cic-primitives atoms/aggregates; provider-specific creation/management is delegated to separate cic-module-<provider> modules via the cic:provider ABI
  license: CC-BY-NC-SA-4.0
  main_branch: storage/main
  owner: Gabor Zoltan Sinko
  maintenance:
    status: active
    supported_until: '2027-12-31'
  contacts:
    - type: email
      value: sinkog@centralinfracore.hu
  links:
    - name: repository
      url: https://github.com/CentralInfraCore/cic-storage.git
compiler_settings:
  meta_schemas_dir: ./
  source_dir: schemas
  meta_schema_file: md.meta.schema.yaml
  primitive_schema_file: schemas/index.yaml
  vault_key_name: cic-my-sign-key
  vault_cert_path: "cic-my-sign-key/crt/bar"
  owner_email: sinkog@centralinfracore.hu
  validity_days: 365
x-cic:
  repo_type: domain
