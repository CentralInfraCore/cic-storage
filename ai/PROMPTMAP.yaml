version: 1
context: cic-storage

# Státuszok: pending | in_progress | done | blocked

entries:

  # ── Phase 1: Bootstrap ──────────────────────────────────────────────────────

  - task: "repo-bootstrap"
    status: done
    priority: 1
    milestone: bootstrap
    prompt: |
      Bootstrap cic-storage repót cic-primitives@v0.1.2-ből.
      project.yaml, dependency.yaml, CLAUDE.md, ai/ testreszabása.
    accept: make validate
    produces:
      - project.yaml
      - dependency.yaml
      - CLAUDE.md
      - ai/

  # ── Phase 2: StorageResource domain séma ────────────────────────────────────

  - task: "storage-resource-domain"
    status: pending
    priority: 2
    milestone: domain
    blocked_by: "repo-bootstrap"
    prompt: |
      Hozd létre az egységes StorageResource DomainComposition-t:
      Fájl: schemas/domain/storage-resource.yaml

      config_surface (core):
        size_gb: integer, 1..65536 — mandatory
        access_mode: enum [read_write_once, read_only_many, read_write_many]

      config_surface (capability: filesystem):
        filesystem: enum [ext4, xfs, ntfs, btrfs, none]

      config_surface (capability: encryption):
        encryption: boolean, default false
        encryption_key_ref: string, optional

      config_surface (capability: tagging):
        tags: list {key, value}

      state_surface:
        attach_state: enum [attached, detached, attaching, detaching, error, unknown] — mandatory
        attached_to: string, optional — compute resource address
        size_actual_gb: integer, optional
        usage_bytes: integer, optional (capability: usage_metrics)
        health: enum [ok, degraded, failed, unknown], optional (capability: health_monitoring)

      operation_surface:
        attach: core — input: target (compute address); output: attach_state
        detach: core, idempotent — output: attach_state
        resize: capability: resize_online vagy offline — input: size_gb
        snapshot: capability: snapshot — input: snapshot_name; output: snapshot_ref
        delete: confirm required — MANUAL ONLY

      notification_surface:
        attach-state-changed: core
        threshold-exceeded: capability: usage_metrics
        health-degraded: capability: health_monitoring

      binding_surface:
        backend: enum [hypervisor, san, cloud]
        address: {backend}/{provider}/{location}/{id}
        known_adapters: storage-adapter (egységes)

      derivation_chain: YANG + RESTCONF + runtime dokumentálva
    accept: make validate
    produces:
      - schemas/domain/storage-resource.yaml

  # ── Phase 3: Adapter contract ────────────────────────────────────────────────

  - task: "storage-adapter-contract"
    status: pending
    priority: 3
    milestone: adapter-contracts
    blocked_by: "storage-resource-domain"
    prompt: |
      Definiáld az egységes storage-adapter contract-ját:
      schemas/adapters/storage-adapter.yaml (D-001 alapján — 1 contract)
        observe: GET state → StorageResource state_surface
        apply:   PATCH config → config_surface
        watch:   event stream → NotificationSurface
      known_implementations per backend:
        hypervisor: Proxmox storage API, libvirt storage pool, qemu-img
        san:        NetApp ONTAP REST, Pure Storage API, iSCSI target
        cloud:      AWS EBS API, GCP Persistent Disk API, Azure Disk API
    accept: make validate
    produces:
      - schemas/adapters/storage-adapter.yaml

  # ── Phase 4: Első signed release ────────────────────────────────────────────

  - task: "signed-release"
    status: pending
    priority: 4
    milestone: release
    blocked_by: "storage-adapter-contract"
    prompt: |
      Első signed release: storage/releases/v0.1.0
      make release → storage/@v0.1.0 tag
    accept: make validate && git tag -l "storage/@v*"
